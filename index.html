
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>發票金額計算器</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f5f9;color:#172235;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}
main{max-width:520px;margin:60px auto;padding:30px;background:white;border-radius:20px;box-shadow:0 8px 30px #0000000c}
h1{font-size:26px;margin:0 0 10px}
p{color:#667085;font-size:14px;line-height:1.7;margin:0 0 26px}
label{display:block;font-weight:600;margin:20px 0 8px}
input{width:100%;padding:15px;border:1px solid #cbd5e1;border-radius:12px;font-size:23px;outline:none}
input:focus{border-color:#2563eb;box-shadow:0 0 0 3px #2563eb20}
small{display:block;margin-top:7px;color:#8290a1}
button{width:100%;padding:15px;margin-top:28px;border:0;border-radius:12px;background:#172235;color:white;font-size:16px;cursor:pointer}
footer{text-align:center;color:#8290a1;font-size:12px;margin-top:20px}
@media(max-width:600px){main{margin:16px;padding:24px}}
</style>
</head>
<body>
<main>
<h1>發票金額計算器</h1>
<p>輸入任一金額，其他欄位自動換算。<br>營業稅 5%｜90% 金額計算</p>
<label for="base">未稅金額（NT$）</label>
<input id="base" type="text" inputmode="decimal" placeholder="例如 10,000">
<small>原始未稅金額</small>
<label for="tax">含稅金額（NT$）</label>
<input id="tax" type="text" inputmode="decimal" placeholder="例如 10,500">
<small>未稅金額 × 1.05</small>
<label for="sale">90% 金額（NT$）</label>
<input id="sale" type="text" inputmode="decimal" placeholder="例如 9,000">
<small>未稅金額 × 0.90</small>
<button onclick="clearAll()">清除全部</button>
<footer>計算只在瀏覽器內進行，不會上傳資料</footer>
</main>
<script>
const ids=["base","tax","sale"];
const fields=Object.fromEntries(ids.map(id=>[id,document.getElementById(id)]));
function format(n){
return new Intl.NumberFormat("en-US",{maximumFractionDigits:2}).format(Math.round((n+Number.EPSILON)*100)/100);
}
ids.forEach(id=>{
fields[id].addEventListener("input",()=>{
const raw=fields[id].value.replace(/,/g,"").trim();
if(raw===""||raw==="."||raw==="-"){
ids.filter(x=>x!==id).forEach(x=>fields[x].value="");
return;
}
const num=Number(raw);
if(!Number.isFinite(num))return;
const base=id==="base"?num:id==="tax"?num/1.05:num/0.9;
const values={base:base,tax:base*1.05,sale:base*0.9};
ids.filter(x=>x!==id).forEach(x=>fields[x].value=format(values[x]));
});
});
function clearAll(){
ids.forEach(id=>fields[id].value="");
fields.base.focus();
}
</script>
</body>
</html>
